name: Deploy to Cluster

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: shoofio/thumbot-mono
  GITOPS_REPO: Shoofio/Homelab-Kubernetes-Gitops
  DEPLOYMENT_PATH: apps/thumbot/deployment.yaml

jobs:
  build-and-deploy:
    name: Build, Push & Update GitOps
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate version tag
        id: version
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          # Use git tag if available, otherwise sha
          TAG=$(git describe --tags --exact-match 2>/dev/null || echo "sha-${SHA_SHORT}")
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Building image with tag: ${TAG}"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update GitOps repo
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          git clone "https://x-access-token:${GITOPS_PAT}@github.com/${{ env.GITOPS_REPO }}.git" gitops-repo
          cd gitops-repo

          NEW_IMAGE="${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}"
          sed -i "s|image: ${{ env.IMAGE_NAME }}:.*|image: ${NEW_IMAGE}|" "${{ env.DEPLOYMENT_PATH }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.DEPLOYMENT_PATH }}"

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "deploy: thumbot-mono ${{ steps.version.outputs.tag }}"
            git push
            echo "Pushed image tag update to gitops repo"
          fi
